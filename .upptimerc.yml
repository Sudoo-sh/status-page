# Upptime configuration for status.sudoo.sh.
# Docs: https://upptime.js.org/docs/configuration
#
# Checks use the same health paths as the platform's own monitor, so no check
# goes through a sign-in page or a Cloudflare challenge. Redirects are not
# followed (maxRedirects: 0): the first response is what is checked.
owner: Sudoo-sh
repo: status-page

skipDescriptionUpdate: true

sites:
  - name: Hub API
    slug: hub-api
    url: https://hub.sudoo.sh/healthz
    expectedStatusCodes: [200]
    maxRedirects: 0
    icon: https://sudoo.sh/favicon.svg

  # /health is the one path of the sign-in site that never touches a sign-in flow.
  - name: Sign-in
    slug: sign-in
    url: https://auth.sudoo.sh/health
    expectedStatusCodes: [200]
    maxRedirects: 0
    icon: https://sudoo.sh/favicon.svg

  # Signed-out visitors are redirected to the sign-in site; the redirect itself
  # is the healthy answer, so it is not followed.
  - name: Account
    slug: account
    url: https://app.sudoo.sh/
    expectedStatusCodes: [200, 201, 202, 203, 204, 301, 302, 303, 307, 308]
    maxRedirects: 0
    icon: https://sudoo.sh/favicon.svg

  - name: Admin
    slug: admin
    url: https://admin.sudoo.sh/health
    expectedStatusCodes: [200]
    maxRedirects: 0
    icon: https://sudoo.sh/favicon.svg

  - name: Developers
    slug: developers
    url: https://developers.sudoo.sh/
    expectedStatusCodes: [200]
    maxRedirects: 0
    icon: https://sudoo.sh/favicon.svg

  - name: Marketplace
    slug: marketplace
    url: https://marketplace.sudoo.sh/
    expectedStatusCodes: [200]
    maxRedirects: 0
    icon: https://sudoo.sh/favicon.svg

  - name: Files
    slug: files
    url: https://files.sudoo.sh/healthz
    expectedStatusCodes: [200]
    maxRedirects: 0
    icon: https://sudoo.sh/favicon.svg

  - name: Website
    slug: website
    url: https://sudoo.sh/
    expectedStatusCodes: [200]
    maxRedirects: 0
    icon: https://sudoo.sh/favicon.svg

  - name: Docs
    slug: docs
    url: https://docs.sudoo.sh/
    expectedStatusCodes: [200]
    maxRedirects: 0
    icon: https://sudoo.sh/favicon.svg

  # get.sudoo.sh only redirects (302) to the installer script of the latest release.
  - name: Installer
    slug: installer
    url: https://get.sudoo.sh/
    expectedStatusCodes: [302]
    maxRedirects: 0
    icon: https://sudoo.sh/favicon.svg

status-website:
  cname: status.sudoo.sh
  name: Sudoo.sh status
  logoUrl: https://sudoo.sh/favicon.svg
  faviconSvg: https://sudoo.sh/favicon.svg
  favicon: https://sudoo.sh/favicon.svg
  # Plum (#714b67) theme with light and dark variants (assets/sudoo-theme.css).
  customHeadHtml: '<style>:root { color-scheme: light dark; --body-background-color: #fafafa; --body-text-color: #171717; --card-background-color: #ffffff; --nav-background-color: #ffffff; --nav-border-bottom-color: #e4e4e7; --nav-current-border-bottom-color: #714b67; --card-border-color: #e4e4e7; --down-border-left-color: #dc2626; --down-background-color: #fde2e2; --degraded-border-left-color: #d97706; --up-border-left-color: #16a34a; --tag-color: #ffffff; --tag-up-background-color: #16a34a; --tag-down-background-color: #dc2626; --tag-degraded-background-color: #d97706; --change-background-color: #d97706; --error-button-border-color: #5f3d56; --error-button-background-color: #714b67; --error-button-color: #ffffff; --submit-button-border-color: #5f3d56; --submit-button-background-color: #714b67; --submit-button-color: #ffffff; --graph-opacity: 1; --graph-filter: none; } @media (prefers-color-scheme: dark) { :root { --body-background-color: #141415; --body-text-color: #ededed; --card-background-color: #19191b; --nav-background-color: #19191b; --nav-border-bottom-color: #2a2a2c; --nav-current-border-bottom-color: #c79bbd; --card-border-color: #2a2a2c; --down-border-left-color: #e5484d; --down-background-color: #3b1517; --degraded-border-left-color: #f5a524; --up-border-left-color: #4cc38a; --tag-color: #141415; --tag-up-background-color: #4cc38a; --tag-down-background-color: #e5484d; --tag-degraded-background-color: #f5a524; --change-background-color: #f5a524; --error-button-border-color: #d9b6d0; --error-button-background-color: #c79bbd; --error-button-color: #1b1219; --submit-button-border-color: #d9b6d0; --submit-button-background-color: #c79bbd; --submit-button-color: #1b1219; --graph-opacity: 0.9; --graph-filter: none; } } html, body, button, input, select { font-family: -apple-system, BlinkMacSystemFont, "Inter", "Segoe UI", system-ui, sans-serif; -webkit-font-smoothing: antialiased; } a { color: inherit; } a:focus-visible, button:focus-visible { outline: 3px solid rgb(113 75 103 / 0.35); outline-offset: 2px; border-radius: 8px; }</style>'
  introTitle: "Sudoo.sh status"
  introMessage: "Live status of Sudoo.sh services."
  navbar:
    - title: Status
      href: /
    - title: Website
      href: https://sudoo.sh
    - title: Support
      href: mailto:support@sudoo.sh
  metaTags:
    - name: color-scheme
      content: "light dark"
    - name: theme-color
      content: "#714b67"

i18n:
  footer: "© Sudoo.sh · [sudoo.sh](https://sudoo.sh) · [support@sudoo.sh](mailto:support@sudoo.sh) · Powered by [Upptime](https://upptime.js.org)"
